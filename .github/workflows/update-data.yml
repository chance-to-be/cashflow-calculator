name: Update analysis data

# 공공데이터 수집 → data/ JSON 갱신 커밋 → (main이면) Pages 자동 재배포
# 필요한 저장소 시크릿: DATA_GO_KR_KEY, SEOUL_OPEN_KEY, (선택) KAKAO_REST_KEY
# 자세한 설정은 docs/DATA_SETUP.md 참고

on:
  schedule:
    - cron: '0 19 * * 1,4'   # 화·금 04:00 KST — 증분 수집이라 여러 번 돌며 채워진다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 실거래가 수집 (국토부)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch_trades.mjs

      - name: 지하철 승하차 수집 (서울열린데이터광장)
        env:
          SEOUL_OPEN_KEY: ${{ secrets.SEOUL_OPEN_KEY }}
        run: node scripts/fetch_subway.mjs

      - name: 역→법정동 매핑 갱신
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: node scripts/build_station_map.mjs

      - name: 요약 데이터 빌드
        env:
          REAL_DATA: '1'
        run: node scripts/build_summary.mjs

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: 공공데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
